[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[project]
name = "amsc-job-manager"
version = "0.1.0"
dependencies = [  
  "pathlib",  
  "globus_sdk",
  "authlib",
  "httpx"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]