[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
[project]
name = "amsc-job-manager"
version = "0.1.0"
dependencies = [  
  "pathlib",  
  "globus_sdk",
  "authlib",
  "httpx",
  "pydantic",
  "asteval"
]

[project.optional-dependencies]
server = ["mcp>=2.3,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"amscjobmanager.iri_api" = ["implementations/*.json"]
